<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-size: 28px; font-weight: 850; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .section { font-size: 12px; font-weight: 850; fill: #475569; letter-spacing: .8px; }
      .card-title { font-size: 18px; font-weight: 850; fill: #0f172a; }
      .card-subtitle { font-size: 12px; fill: #475569; }
      .small { font-size: 11px; fill: #64748b; }
      .tiny { font-size: 10px; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #dbe4ef; stroke-width: 1.4; }
      .input { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.6; }
      .core { fill: #cffafe; stroke: #22d3ee; stroke-width: 1.9; }
      .manager { fill: #dcfce7; stroke: #86efac; stroke-width: 1.7; }
      .video { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .torrent { fill: #fdf2f8; stroke: #f9a8d4; stroke-width: 1.6; }
      .store { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.6; }
      .optional { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7,5; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-dasharray: 8,6; marker-end: url(#arrowSoft); }
      .label { font-size: 11px; font-weight: 700; fill: #475569; }
    </style>
  </defs>

  <rect width="1440" height="860" fill="#f8fafc"/>

  <text x="720" y="48" text-anchor="middle" class="title">Telegram Media Server Architecture</text>
  <text x="720" y="74" text-anchor="middle" class="subtitle">Inputs enter TMS, TMS chooses a downloader, state is persisted, media is served.</text>

  <!-- Inputs -->
  <rect x="78" y="112" width="1284" height="126" rx="20" class="panel"/>
  <text x="106" y="142" class="section">INPUTS</text>

  <rect x="132" y="166" width="260" height="48" rx="14" class="input"/>
  <text x="262" y="196" text-anchor="middle" class="card-title">Telegram Bot</text>

  <rect x="472" y="166" width="260" height="48" rx="14" class="input"/>
  <text x="602" y="196" text-anchor="middle" class="card-title">REST API + Swagger</text>

  <rect x="812" y="166" width="260" height="48" rx="14" class="optional"/>
  <text x="942" y="186" text-anchor="middle" class="tiny">optional</text>
  <text x="942" y="205" text-anchor="middle" class="card-title">OpenClaw Skill</text>

  <rect x="1152" y="166" width="156" height="48" rx="14" class="optional"/>
  <text x="1230" y="186" text-anchor="middle" class="tiny">optional</text>
  <text x="1230" y="205" text-anchor="middle" class="card-title">Webhook</text>

  <text x="262" y="226" text-anchor="middle" class="small">commands, links, torrent files, search UI</text>
  <text x="602" y="226" text-anchor="middle" class="small">add, list, delete, search</text>
  <text x="942" y="226" text-anchor="middle" class="small">uses REST API; receives completion hooks</text>

  <!-- Core -->
  <rect x="78" y="286" width="1284" height="178" rx="20" class="panel"/>
  <text x="106" y="316" class="section">TMS CORE</text>

  <rect x="170" y="342" width="360" height="82" rx="18" class="core"/>
  <text x="350" y="372" text-anchor="middle" class="card-title">Auth + Handlers</text>
  <text x="350" y="396" text-anchor="middle" class="card-subtitle">Telegram router, API handlers, sessions</text>
  <text x="350" y="415" text-anchor="middle" class="small">roles, temporary passwords, callbacks</text>

  <rect x="600" y="322" width="306" height="122" rx="20" class="core"/>
  <text x="753" y="354" text-anchor="middle" class="card-title">App Container</text>
  <text x="753" y="380" text-anchor="middle" class="card-subtitle">Bot, API, DB, Config</text>
  <text x="753" y="402" text-anchor="middle" class="card-subtitle">DownloadManager, DeleteQueue</text>
  <text x="753" y="424" text-anchor="middle" class="small">startup resume + graceful shutdown</text>

  <rect x="976" y="342" width="294" height="82" rx="18" class="manager"/>
  <text x="1123" y="372" text-anchor="middle" class="card-title">Download Pipeline</text>
  <text x="1123" y="396" text-anchor="middle" class="card-subtitle">factory, queue, semaphore, monitor</text>
  <text x="1123" y="415" text-anchor="middle" class="small">progress updates, notifications, conversion jobs</text>

  <!-- Download backends -->
  <rect x="78" y="512" width="1284" height="142" rx="20" class="panel"/>
  <text x="106" y="542" class="section">DOWNLOAD BACKENDS</text>

  <rect x="144" y="572" width="214" height="54" rx="15" class="video"/>
  <text x="251" y="596" text-anchor="middle" class="card-title">yt-dlp</text>
  <text x="251" y="616" text-anchor="middle" class="card-subtitle">streaming video + updates</text>

  <rect x="434" y="572" width="234" height="54" rx="15" class="torrent"/>
  <text x="551" y="596" text-anchor="middle" class="card-title">qBittorrent</text>
  <text x="551" y="616" text-anchor="middle" class="card-subtitle">primary torrent backend</text>

  <rect x="744" y="572" width="178" height="54" rx="15" class="optional"/>
  <text x="833" y="592" text-anchor="middle" class="tiny">fallback</text>
  <text x="833" y="612" text-anchor="middle" class="card-title">aria2c</text>

  <rect x="998" y="572" width="150" height="54" rx="15" class="optional"/>
  <text x="1073" y="592" text-anchor="middle" class="tiny">optional</text>
  <text x="1073" y="612" text-anchor="middle" class="card-title">Prowlarr</text>

  <!-- State and output -->
  <rect x="78" y="702" width="1284" height="110" rx="20" class="panel"/>
  <text x="106" y="732" class="section">STATE AND OUTPUT</text>

  <rect x="132" y="756" width="230" height="44" rx="14" class="store"/>
  <text x="247" y="784" text-anchor="middle" class="card-title">SQLite / GORM</text>

  <rect x="432" y="756" width="230" height="44" rx="14" class="store"/>
  <text x="547" y="784" text-anchor="middle" class="card-title">MOVIE_PATH</text>

  <rect x="732" y="756" width="212" height="44" rx="14" class="optional"/>
  <text x="838" y="774" text-anchor="middle" class="tiny">optional</text>
  <text x="838" y="793" text-anchor="middle" class="card-title">TV Compatibility</text>

  <rect x="1014" y="756" width="156" height="44" rx="14" class="optional"/>
  <text x="1092" y="774" text-anchor="middle" class="tiny">optional</text>
  <text x="1092" y="793" text-anchor="middle" class="card-title">minidlna</text>

  <rect x="1240" y="756" width="94" height="44" rx="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="1287" y="784" text-anchor="middle" class="card-title">Smart TV</text>

  <!-- Clean main flows -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M602,238 V286" class="arrow"/>
    <path d="M262,238 V264 H350 V342" class="arrow"/>
    <path d="M942,238 V264 H350 V342" class="arrow-soft"/>
    <text x="770" y="258" text-anchor="middle" class="label">requests and commands</text>

    <path d="M530,383 H600" class="arrow"/>
    <path d="M906,383 H976" class="arrow"/>

    <path d="M1123,424 V488 H251 V572" class="arrow"/>
    <text x="340" y="500" text-anchor="middle" class="label">video URLs</text>

    <path d="M1123,424 V488 H551 V572" class="arrow"/>
    <text x="642" y="500" text-anchor="middle" class="label">magnet / torrent</text>

    <path d="M1123,424 V488 H833 V572" class="arrow-soft"/>
    <text x="898" y="500" text-anchor="middle" class="label">fallback</text>

    <path d="M1123,424 V488 H1073 V572" class="arrow-soft"/>
    <text x="1118" y="500" text-anchor="middle" class="label">search</text>

    <path d="M551,626 V684 H547 V756" class="arrow"/>
    <path d="M251,626 V684 H547 V756" class="arrow"/>
    <path d="M833,626 V684 H547 V756" class="arrow-soft"/>
    <text x="430" y="678" text-anchor="middle" class="label">downloaded media</text>

    <path d="M753,444 V684 H247 V756" class="arrow"/>
    <text x="408" y="698" text-anchor="middle" class="label">users, files, progress, hashes</text>

    <path d="M662,778 H732" class="arrow-soft"/>
    <path d="M944,778 H1014" class="arrow-soft"/>
    <path d="M1170,778 H1240" class="arrow-soft"/>
  </g>

  <rect x="92" y="826" width="1256" height="22" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="720" y="841" text-anchor="middle" class="tiny">qBittorrent is the normal torrent path when configured; aria2 is only an explicit fallback. Completion cleanup removes temp files; deletion removes files, DB rows, and qBittorrent torrents.</text>
</svg>
